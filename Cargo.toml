[package]
name = "portman"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "portman"
path = "src/main.rs"

[[bin]]
name = "portman-gui"
path = "src/gui_main.rs"

[[bin]]
name = "portman-desktop"
path = "src/desktop_main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
sysinfo = "0.30"
nix = { version = "0.27", features = ["process", "signal"] }
tokio = { version = "1", features = ["full"] }
colored = "2.1"
chrono = "0.4"
anyhow = "1.0"
ratatui = "0.27"
crossterm = "0.28"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true

[profile.release-with-debug]
inherits = "release"
debug = true
