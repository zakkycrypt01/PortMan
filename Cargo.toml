[package]
name = "portman"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "portman"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
sysinfo = "0.30"
nix = { version = "0.27", features = ["process", "signal"] }
tokio = { version = "1", features = ["full"] }
colored = "2.1"
chrono = "0.4"
anyhow = "1.0"
ratatui = "0.27"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = true
